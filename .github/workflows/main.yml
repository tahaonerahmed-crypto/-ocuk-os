# =============================================================================
# .github/workflows/build-cocukos.yml
#
# Bu workflow, GitHub'in ucretsiz Ubuntu runner'ini kullanarak CocukOS ISO'sunu
# TAMAMEN OTOMATIK olarak derler. build.sh dosyasini repo icinde nerede olursa
# olsun kendisi bulur, boylece klasor yapisi hatalarina karsi dayaniklidir.
#
# This workflow builds the CocukOS ISO FULLY AUTOMATICALLY on GitHub's free
# Ubuntu runner. It finds build.sh wherever it is in the repo, so it is
# resilient to folder-structure mistakes.
# =============================================================================
name: "CocukOS ISO Derle / Build CocukOS ISO"

on:
  workflow_dispatch:
    inputs:
      ubuntu_iso_url:
        description: "Kaynak Ubuntu ISO adresi / Source Ubuntu ISO URL"
        required: false
        default: "https://releases.ubuntu.com/26.04/ubuntu-26.04.1-desktop-amd64.iso"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: "Kodu al / Checkout code"
        uses: actions/checkout@v4

      - name: "Proje kok dizinini bul / Locate project root"
        id: locate
        run: |
          set -e
          # build.sh dosyasi repo icinde nerede olursa olsun (ana dizinde
          # veya bir alt klasorde) otomatik olarak bulunur, boylece dosyalarin
          # yanlislikla bir alt klasore yuklenmis olmasi sorun olmaz.
          #
          # Finds build.sh wherever it is inside the repo (root or a
          # subfolder), so it doesn't matter if the files were accidentally
          # uploaded into a nested folder.
          BUILD_SH_PATH="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -name 'build.sh' -type f | head -n1)"
          if [[ -z "$BUILD_SH_PATH" ]]; then
              echo "::error::build.sh bulunamadi! Repo icerigini kontrol edin. / build.sh not found! Check the repo contents."
              find "$GITHUB_WORKSPACE" -maxdepth 3
              exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_SH_PATH")"
          echo "Bulundu / Found: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: "Disk alani acilsin / Free up disk space"
        run: |
          set -x
          # GitHub runner'inda varsayilan olarak kurulu, bu proje icin
          # gereksiz olan buyuk arac zincirlerini kaldirarak ~25-30GB
          # ek alan aciyoruz.
          # Removes large preinstalled toolchains we don't need for this
          # project, freeing up ~25-30GB of extra space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup /opt/az /usr/local/share/boost \
                      /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          df -h

      - name: "Gerekli paketler kuruluyor / Install required packages"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
              squashfs-tools xorriso isolinux syslinux-utils rsync wget

      - name: "Script izinleri / Script permissions"
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          chmod +x build.sh scripts/*.sh scripts/lib/*.sh test/*.sh
          chmod +x chroot-payload/usr/local/sbin/*.sh

      - name: "CocukOS ISO derleniyor / Build CocukOS ISO"
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          COCUKOS_WORKDIR: /mnt/cocukos-work
          COCUKOS_OUTDIR: /mnt/cocukos-output
          COCUKOS_UBUNTU_ISO_URL: ${{ github.event.inputs.ubuntu_iso_url }}
        run: |
          sudo -E ./build.sh auto

      - name: "Sonuc dosyalari listeleniyor / List result files"
        run: ls -lh /mnt/cocukos-output

      - name: "ISO'yu artifact olarak yukle / Upload ISO as artifact"
        uses: actions/upload-artifact@v4
        with:
          name: CocukOS-26.04.1-amd64-iso
          path: |
            /mnt/cocukos-output/CocukOS-26.04.1-amd64.iso
            /mnt/cocukos-output/CocukOS-26.04.1-amd64.iso.sha256
          retention-days: 14
          compression-level: 0
